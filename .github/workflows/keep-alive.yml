name: Keep Alive

on:
  schedule:
    # Run every 4 hours to keep Supabase Free Tier active 24/7/365 without auto-pausing
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Frontend Vercel Deployment
        run: |
          curl -f -s -o /dev/null -w "Frontend HTTP: %{http_code}\n" https://sync-pad-io.vercel.app || echo "Frontend ping warning"

      - name: Ping Supabase Database & REST API
        run: |
          SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            curl -f -s -o /dev/null -w "Supabase REST API HTTP: %{http_code}\n" \
              -H "apikey: $SUPABASE_KEY" \
              "$SUPABASE_URL/rest/v1/rooms?select=id&limit=1" || echo "Supabase ping warning"
          else
            echo "Supabase secrets not set; skipping ping."
          fi
