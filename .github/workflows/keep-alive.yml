name: Keep Alive

on:
  schedule:
    # Run once every 6 hours (Supabase free tier requires activity within 1 week)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Frontend
        run: curl -f https://sync-pad-io.vercel.app || echo "Frontend ping failed"
